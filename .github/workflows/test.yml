name: Run tests

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

env:
  SPEAKEASY_VERSION: v2.950.11

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # TODO(b/419883265): remove commonjs bundles when dropping node 20 support.
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: USE_LOCAL_BUILD=true npm ci
    - run: npm run build
    - name: Verify clean npm package contents
      run: npm pack --dry-run
    - run: npm run unit-test
    - run: npm run test-server-tests
    - run: |
        cd sdk-samples
        npm install
        npm run build

  api-consistency:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - run: scripts/validate_api_consistency.sh
