name: Run code coverage

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

jobs:
  coverage:
    # Disabled: this check has never passed reliably and isn't monitored.
    # On push/PR the job reports as "skipped" (which satisfies required
    # status checks). It still runs when triggered manually.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: USE_LOCAL_BUILD=true npm ci
    - run: npm run coverage-report
